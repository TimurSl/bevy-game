<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bevy Game</title>
    <style>
      html, body { margin: 0; height: 100%; background: #14171f; overflow: hidden; }
      canvas#bevy { width: 100%; height: 100%; display: block; }
    </style>
  </head>
  <body>
    <canvas id="bevy"></canvas>
    <script type="module">
      import init from "./game.js";
      init().catch((e) => {
        // Bevy/winit throws a harmless "control flow" exception to unwind the event loop.
        if (!String(e).includes("Using exceptions for control flow")) throw e;
      });
    </script>
  </body>
</html>
